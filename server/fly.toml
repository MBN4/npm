# Fly.io app configuration for the NMP backend (Express + SQLite).
# Deploy with: fly launch --no-deploy (first time, to create the app)
#              fly volumes create nmp_data --size 1 --region <your-region>
#              fly deploy
app = "nmp-api"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "5000"
  HOST = "0.0.0.0"
  DB_PATH = "/app/data/nmp.sqlite"

[mounts]
  source = "nmp_data"
  destination = "/app/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
