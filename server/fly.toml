# fly.toml app configuration file generated for nmp-api on 2026-10-16T00:01:24+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nmp-api'
primary_region = 'sin'

[build]
[env]
  DB_PATH = '/app/data/nmp.sqlite'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '5000'

[[mounts]]
  source = 'nmp_data'
  destination = '/app/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
